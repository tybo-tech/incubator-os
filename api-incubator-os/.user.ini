; PHP session lifetime for the Incubator OS API.
;
; The application signs users out after 24 minutes by default because PHP's
; session.gc_maxlifetime defaults to 1440 seconds. On cPanel/LiteSpeed the host's
; session-cleanup cron reads this value from .user.ini (a runtime ini_set in PHP
; is not always honoured), so set it here as well as in helpers/Session.php.
;
; Keep this in lock-step with APP_SESSION_LIFETIME (86400 = 24 hours).
session.gc_maxlifetime = 86400
session.cookie_lifetime = 86400
